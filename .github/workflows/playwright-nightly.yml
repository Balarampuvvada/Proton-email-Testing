name: Playwright Nightly (extended timeout)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-extended:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run delivery-sensitive tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PROTON_TEST_EMAIL: ${{ secrets.PROTON_TEST_EMAIL }}
          PROTON_TEST_PASSWORD: ${{ secrets.PROTON_TEST_PASSWORD }}
          PROTON_RECEIVER_EMAIL: ${{ secrets.PROTON_RECEIVER_EMAIL }}
          PROTON_RECEIVER_PASSWORD: ${{ secrets.PROTON_RECEIVER_PASSWORD }}
        run: npx playwright test tests/compose tests/attachments tests/filters --project=chromium --workers=1
      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload nightly test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: test-results/
          retention-days: 7
